<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Admin CMS - CESAREC</title>
    <link rel="icon" href="/tablogo.png" type="image/png">
    <link rel="stylesheet" href="/admin.css">
</head>
<body>
    <main class="admin-shell">
        <section id="login-panel" class="login-panel">
            <div>
                <p class="eyebrow">CESAREC CMS</p>
                <h1>Admin login</h1>
            </div>
            <form id="login-form" class="login-form">
                <label for="admin-password">Password</label>
                <input id="admin-password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Sign in</button>
                <p id="login-error" class="form-error" role="alert"></p>
            </form>
        </section>

        <section id="cms-panel" class="cms-panel" hidden>
            <header class="admin-header">
                <div>
                    <p class="eyebrow">CESAREC CMS</p>
                    <h1>Blog content</h1>
                </div>
                <div class="header-actions">
                    <button type="button" id="new-post-btn">New post</button>
                    <button type="button" id="logout-btn" class="secondary">Logout</button>
                </div>
            </header>

            <nav class="admin-tabs" aria-label="Admin sections">
                <button type="button" class="admin-tab active" data-section="posts">Posts</button>
                <button type="button" class="admin-tab" data-section="leads">Leads & analytics</button>
            </nav>

            <div class="admin-section active" data-admin-section="posts">
                <div class="admin-grid">
                <aside class="post-list-wrap">
                    <h2>Posts</h2>
                    <div id="post-list" class="post-list"></div>
                </aside>

                <form id="post-form" class="editor">
                    <input type="hidden" id="post-id">
                    <div class="editor-top">
                        <div class="field">
                            <label for="hero-image">Hero image URL</label>
                            <input id="hero-image" name="hero_image" type="url" placeholder="https://example.com/image.jpg">
                        </div>
                        <div class="status-pill" id="status-pill">Draft</div>
                    </div>

                    <div class="lang-tabs" role="tablist" aria-label="Post language">
                        <button type="button" class="lang-tab active" data-lang="en">EN</button>
                        <button type="button" class="lang-tab" data-lang="az">AZ</button>
                        <button type="button" class="lang-tab" data-lang="ru">RU</button>
                    </div>

                    <div id="translation-panels"></div>

                    <div class="editor-actions">
                        <button type="button" id="save-draft-btn" class="secondary">Save draft</button>
                        <button type="button" id="publish-btn">Publish</button>
                        <button type="button" id="delete-btn" class="danger">Delete</button>
                    </div>
                    <p id="editor-message" class="editor-message" role="status"></p>
                </form>
                </div>
            </div>

            <div class="admin-section" data-admin-section="leads">
                <section class="dashboard-panel">
                    <div class="dashboard-header">
                        <div>
                            <h2>Solar calculator leads</h2>
                            <p>Phone numbers, submitted inputs, and calculated outputs from solar calculator users.</p>
                        </div>
                        <div class="header-actions">
                            <button type="button" id="refresh-leads-btn" class="secondary">Refresh</button>
                            <button type="button" id="indexnow-btn">Submit IndexNow URLs</button>
                        </div>
                    </div>

                    <div id="analytics-cards" class="analytics-cards"></div>
                    <p id="indexnow-message" class="editor-message" role="status"></p>

                    <div class="table-wrap">
                        <table class="lead-table">
                            <thead>
                                <tr>
                                    <th>Created</th>
                                    <th>Phone</th>
                                    <th>Location</th>
                                    <th>System</th>
                                    <th>Inputs</th>
                                    <th>Outputs</th>
                                </tr>
                            </thead>
                            <tbody id="lead-list"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </section>
    </main>
    <script src="/admin.js"></script>
</body>
</html>
